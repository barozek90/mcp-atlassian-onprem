[project]
name = "mcp-atlassian-onprem"
version = "0.1.0"
description = "MCP server for on-prem Jira and Confluence, read-only by default"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "markdownify>=0.13",
    "pypdf>=5",
]

[project.scripts]
mcp-atlassian-onprem = "mcp_atlassian_onprem.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
